name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -f "$SDKMANAGER" ]; then
            yes | $SDKMANAGER "platform-tools" "build-tools;34.0.0" "platforms;android-34" 2>/dev/null || true
          else
            SDKMANAGER2=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager 2>/dev/null | head -1)
            if [ -n "$SDKMANAGER2" ]; then
              yes | $SDKMANAGER2 "platform-tools" "build-tools;34.0.0" "platforms;android-34" 2>/dev/null || true
            fi
          fi
          echo "Android SDK setup complete"

      - name: Install ImageMagick
        run: |
          sudo apt-get install -y imagemagick
          convert --version | head -2

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Validate API server build before APK build
        run: pnpm --filter @workspace/api-server run build
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Set versionCode from run number
        run: |
          VERSION_CODE=${{ github.run_number }}
          node -e "
            const fs = require('fs');
            const p = 'artifacts/tamil-ai-chat/app.json';
            const j = JSON.parse(fs.readFileSync(p,'utf8'));
            j.expo.android.versionCode = $VERSION_CODE;
            fs.writeFileSync(p, JSON.stringify(j, null, 2));
            console.log('versionCode:', j.expo.android.versionCode);
          "

      - name: Fetch latest app icon from Cloudinary
        run: |
          ICON="artifacts/tamil-ai-chat/assets/images/icon.png"
          CLOUD="dazmrxsyc"

          echo "Checking Cloudinary for latest app icon..."
          RESP=$(curl -sf "https://res.cloudinary.com/${CLOUD}/image/list/my-girls:app-icon.json" 2>/dev/null || echo "")

          ICON_URL=""
          if [ -n "$RESP" ]; then
            ICON_URL=$(node -e "
              try {
                const d = JSON.parse(process.argv[1]);
                const imgs = d.resources || [];
                if (imgs.length === 0) { process.exit(1); }
                imgs.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
                const pid = imgs[0].public_id;
                console.log('https://res.cloudinary.com/dazmrxsyc/image/upload/f_png,w_1024,h_1024,c_fill/' + pid + '.png');
              } catch(e) { process.exit(1); }
            " "$RESP" 2>/dev/null || echo "")
          fi

          if [ -n "$ICON_URL" ]; then
            echo "Downloading icon from Cloudinary: $ICON_URL"
            curl -fsSL "$ICON_URL" -o "$ICON"
            SIZE=$(stat -c%s "$ICON" 2>/dev/null || echo 0)
            echo "Custom icon downloaded: $SIZE bytes"
          else
            echo "No custom icon in Cloudinary — using default icon.png"
          fi

          SIZE=$(stat -c%s "$ICON")
          SHA=$(sha256sum "$ICON" | awk '{print $1}')
          echo "icon.png: $SIZE bytes | sha256=$SHA"

      - name: Expo Prebuild
        working-directory: artifacts/tamil-ai-chat
        env:
          EXPO_PUBLIC_API_URL: https://my-dream-women-v-3-0.onrender.com
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
          EXPO_NO_TELEMETRY: 1
          CI: 1
        run: |
          npx expo prebuild --platform android --clean --no-install 2>&1
          if [ ! -d android ]; then echo "android/ not created"; exit 1; fi
          echo "android/ created"

      - name: Verify generated media permissions
        run: |
          MANIFEST="artifacts/tamil-ai-chat/android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "Generated AndroidManifest.xml not found"
            exit 1
          fi

          REQUIRED_PERMISSIONS=(
            "android.permission.READ_MEDIA_IMAGES"
            "android.permission.READ_MEDIA_VIDEO"
            "android.permission.READ_MEDIA_VISUAL_USER_SELECTED"
          )
          for PERMISSION in "${REQUIRED_PERMISSIONS[@]}"; do
            if ! grep -q "$PERMISSION" "$MANIFEST"; then
              echo "Missing required permission: $PERMISSION"
              exit 1
            fi
            echo "Verified manifest permission: $PERMISSION"
          done

          if [ -e "artifacts/tamil-ai-chat/plugins/removeVisualUserSelected.js" ] ||
             grep -R -q "removeVisualUserSelected" "artifacts/tamil-ai-chat/app.json" "artifacts/tamil-ai-chat/plugins" 2>/dev/null; then
            echo "The custom removeVisualUserSelected plugin is still active"
            exit 1
          fi
          echo "Verified custom visual-user-selected removal plugin is disabled"

          echo "Final generated media permission entries:"
          grep -E "READ_MEDIA_(IMAGES|VIDEO|VISUAL_USER_SELECTED)" "$MANIFEST"

      - name: Inject custom icons via ImageMagick
        run: |
          ICON="artifacts/tamil-ai-chat/assets/images/icon.png"
          ADAPTIVE="artifacts/tamil-ai-chat/assets/images/adaptive-icon-foreground.png"
          RES="artifacts/tamil-ai-chat/android/app/src/main/res"

          find "$RES" -name "ic_launcher*.webp" -delete
          find "$RES" -name "ic_launcher*.png" -delete

          for FOLDER_SIZE in \
            "mipmap-mdpi:48:108" \
            "mipmap-hdpi:72:162" \
            "mipmap-xhdpi:96:216" \
            "mipmap-xxhdpi:144:324" \
            "mipmap-xxxhdpi:192:432"; do

            FOLDER="${FOLDER_SIZE%%:*}"
            REST="${FOLDER_SIZE#*:}"
            LAUNCHER_PX="${REST%%:*}"
            FOREGROUND_PX="${REST##*:}"
            DIR="$RES/$FOLDER"
            mkdir -p "$DIR"

            convert "$ICON" -resize "${LAUNCHER_PX}x${LAUNCHER_PX}!" \
              -define png:compression-level=9 "$DIR/ic_launcher.png"
            convert "$ICON" -resize "${LAUNCHER_PX}x${LAUNCHER_PX}!" \
              -define png:compression-level=9 "$DIR/ic_launcher_round.png"
            convert "$ADAPTIVE" -resize "${FOREGROUND_PX}x${FOREGROUND_PX}!" \
              -define png:compression-level=9 "$DIR/ic_launcher_foreground.png"

            echo "$FOLDER done"
          done

      - name: Bundle JS with expo export:embed
        working-directory: artifacts/tamil-ai-chat
        env:
          EXPO_PUBLIC_API_URL: https://my-dream-women-v-3-0.onrender.com
          EXPO_NO_TELEMETRY: 1
          NODE_ENV: production
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res
          npx expo export:embed \
            --platform android \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --dev false 2>&1
          BUNDLE=android/app/src/main/assets/index.android.bundle
          if [ -f "$BUNDLE" ]; then echo "Bundle: $(stat -c%s $BUNDLE) bytes"
          else echo "Bundle not created"; exit 1; fi

      - name: Verify ZIP upload feature is bundled
        run: |
          grep -q "ZIP Files" artifacts/tamil-ai-chat/app/cloud-storage.tsx
          grep -q "Upload ZIP" artifacts/tamil-ai-chat/app/cloud-storage.tsx
          grep -q "Upload ZIP" artifacts/tamil-ai-chat/android/app/src/main/assets/index.android.bundle
          echo "ZIP upload feature verified in source and Android bundle"

      - name: Build APK
        working-directory: artifacts/tamil-ai-chat/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug -PbundleInDebug=true --no-daemon 2>&1 | tee /tmp/gradle.log
          find . -name "*.apk" | grep -v node_modules | while read f; do
            echo "$(stat -c%s "$f") bytes — $f"
          done | sort -rn

      - name: Locate, validate and copy APK
        run: |
          APK=$(find artifacts/tamil-ai-chat/android -name "*.apk" 2>/dev/null \
            | grep -v node_modules \
            | while read f; do echo "$(stat -c%s "$f" 2>/dev/null||echo 0) $f"; done \
            | sort -rn | awk 'NR==1{print $2}')
          SIZE=$(stat -c%s "$APK" 2>/dev/null || echo 0)
          if [ -z "$APK" ] || [ "$SIZE" -lt 1000000 ]; then
            echo "APK invalid ($SIZE bytes)"; tail -80 /tmp/gradle.log; exit 1
          fi
          APK_NAME="my-dream-women-v${{ github.run_number }}.apk"
          cp "$APK" "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - name: Publish APK via GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ github.run_number }}"
          gh release delete "$TAG" --yes --cleanup-tag \
            --repo ${{ github.repository }} 2>/dev/null || true
          sleep 2
          gh release create "$TAG" "$APK_NAME" \
            --title "My Dream Women — Build ${{ github.run_number }}" \
            --notes "$(git log -1 --pretty='format:%B' HEAD)" \
            --latest \
            --repo ${{ github.repository }}
          echo "https://github.com/${{ github.repository }}/releases/download/$TAG/$APK_NAME"

      - name: Trigger Render Redeploy
        env:
          RENDER_HOOK: ${{ secrets.RENDER_HOOK }}
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_HOOK" ]]; then
            echo "RENDER_HOOK GitHub Actions secret is missing"
            exit 1
          fi
          HTTP_STATUS=$(curl --silent --show-error --location --request POST --retry 2 --retry-delay 5 \
            -o /tmp/render_resp.json -w "%{http_code}" "$RENDER_HOOK")
          echo "Render deploy hook response: HTTP $HTTP_STATUS"
          cat /tmp/render_resp.json || true
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "Render deploy trigger failed"
            exit 1
          fi
          echo "Render redeploy triggered successfully"
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/gradle.log
          retention-days: 7
